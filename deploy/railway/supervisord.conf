; deploy/railway/supervisord.conf — the same three programs as deploy/pod/supervisord.conf, in the
; same startup order (minio -> bucket -> hydradb -> api), with two Railway-specific changes:
;
;   1. [program:api] declares PORT/HOST explicitly instead of relying on inheritance. Railway
;      injects PORT at runtime and health-checks THAT port on the container's own IP, so the value
;      that reaches the node process is not a detail we want to leave implicit. The entrypoint
;      exports both before exec'ing supervisord, so %(ENV_PORT)s always resolves (an unresolvable
;      %(ENV_...)s is a supervisord config error at startup, not a fallback).
;   2. MinIO binds 127.0.0.1 rather than 0.0.0.0. On RunPod the pod's port list was the only door
;      and 9000 was never in it; on Railway every service in a project shares a private network,
;      so the object store binds loopback and is reachable only by the two processes beside it.
;
; Every internal wait is a bash /dev/tcp or marker-file probe: the HydraDB base image ships no
; curl/wget/nc (docs/gauntlets.md, Block B). curl exists in this image, but only because the
; entrypoint's restore needs it — the probes stay dependency-free.
;
; stopwaitsecs=58 on [program:hydradb] is the gauntlet fix for the upstream image SIGKILLing the
; node ~1s after SIGTERM, before it can flush and release the writer lease. It only buys anything
; if whatever stops the CONTAINER waits at least that long: on Railway that means setting
; RAILWAY_DEPLOYMENT_DRAINING_SECONDS (default 0 — see deploy/README.md).

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:minio]
priority=10
command=/usr/bin/minio server %(ENV_ERRATA_DATA_ROOT)s/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; one-shot: ensure the `hydra` bucket exists, then drop a ready marker hydradb waits on. On a
; restored volume the bucket is already there and `mb --ignore-existing` is a no-op — the marker
; is the point. autorestart=false because it is meant to exit 0 once and stay exited.
[program:minio-init]
priority=15
command=/bin/bash -c "until (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; do sleep 1; done; exec 3<&- 3>&-; MC_HOST_m=\"http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000\" /usr/bin/mc mb --ignore-existing m/hydra && touch %(ENV_ERRATA_DATA_ROOT)s/.minio-ready"
autostart=true
autorestart=false
startsecs=0
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:hydradb]
priority=20
command=/bin/bash -c "until [ -f %(ENV_ERRATA_DATA_ROOT)s/.minio-ready ]; do sleep 1; done; exec /usr/local/bin/graph-node"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=58
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
priority=30
directory=/app
environment=PORT="%(ENV_PORT)s",HOST="%(ENV_HOST)s"
command=/bin/bash -c "until (exec 3<>/dev/tcp/127.0.0.1/9090) 2>/dev/null; do sleep 1; done; exec 3<&- 3>&-; exec /usr/local/bin/node dist/index.js"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
