; deploy/pod/supervisord.conf — three programs, one image. Priority order is startup order
; (minio -> bucket -> hydradb -> api); each waits on the previous via a bash /dev/tcp / marker-file
; probe rather than curl/wget/nc, because the HydraDB base image ships none of those
; (docs/gauntlets.md, Block B) and a minimal runtime should not assume more than the base gives it.
;
; stopwaitsecs on [program:hydradb] is the direct fix for the gauntlet finding that the upstream
; HydraDB image's own default stop behaviour SIGKILLs the node after ~1s, never letting it flush or
; release its writer lease. 58s here means supervisord itself waits up to 58s after SIGTERM before
; escalating — but that only helps if whatever stops the CONTAINER (docker/RunPod) also grants a
; stop-timeout of at least that long; see deploy/README.md.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:minio]
priority=10
command=/usr/bin/minio server %(ENV_ERRATA_DATA_ROOT)s/minio --address 0.0.0.0:9000 --console-address 127.0.0.1:9001
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; one-shot: create the `hydra` bucket, then drop a ready marker hydradb waits on. autorestart=false
; because it is meant to exit 0 once and stay exited; startretries covers MinIO's own cold start.
[program:minio-init]
priority=15
command=/bin/bash -c "until (exec 3<>/dev/tcp/127.0.0.1/9000) 2>/dev/null; do sleep 1; done; exec 3<&- 3>&-; MC_HOST_m=\"http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000\" /usr/bin/mc mb --ignore-existing m/hydra && touch %(ENV_ERRATA_DATA_ROOT)s/.minio-ready"
autostart=true
autorestart=false
startsecs=0
startretries=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:hydradb]
priority=20
command=/bin/bash -c "until [ -f %(ENV_ERRATA_DATA_ROOT)s/.minio-ready ]; do sleep 1; done; exec /usr/local/bin/graph-node"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=58
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
priority=30
directory=/app
command=/bin/bash -c "until (exec 3<>/dev/tcp/127.0.0.1/9090) 2>/dev/null; do sleep 1; done; exec 3<&- 3>&-; exec /usr/local/bin/node dist/index.js"
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
