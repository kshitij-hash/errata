# Pinned price sheet. USD per MILLION tokens. Prices are a controlled input to the
# cost column: `usd` in the ledger is computed from THIS sheet, not from the
# provider's self-reported figure (which is also stored, for reconciliation).
#
# `errata-eval prices check` re-fetches the live catalog and diffs against this file;
# any change > 5% aborts and demands a conscious re-pin. Verified against
# openrouter.ai/api/v1/models on 2026-08-16.

source     = "openrouter.ai/api/v1/models"
fetched_at = "2026-08-16"

["qwen/qwen3.7-flash"]              # ANSWER MODEL, all arms
# Catalog headline is 0.03/0.13, but provider-reported cost on ~110K-token prompts is ~0.10/M in
# (long-context tier, not exposed in /api/v1/models). Pinned at the tier rate so the ledger's cap
# enforcement is CONSERVATIVE; short-prompt arms will slightly over-count. Reconciled 2026-08-16
# against usd_reported (170 calls: table $0.567 vs reported $1.889).
in = 0.100
out = 0.390
ctx = 1000000

["google/gemini-3.7-flash"]         # perturber + sensitivity check
in = 0.375
out = 1.875
ctx = 1048576

["anthropic/claude-sonnet-5"]       # judge, primary
