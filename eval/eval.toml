# Errata evaluation harness — the whole configuration surface.
# Every variable lives here; no constant is duplicated in code. report.py renders
# the table caption from this file, so a disclosed number cannot drift from the run.

[run]
run_id         = ""            # empty => UTC timestamp, e.g. "20260819T0930Z"
seeds          = [11, 22, 33]  # >=3 required; sd measures provider nondeterminism at temp 0
sample_seed    = 20260819      # FIXED. Selects the comparison set. NEVER varied per run.
concurrency    = { errata = 8, full_context = 4, naive = 8, judge = 8 }
warmup_queries = 5             # discarded from latency stats, kept in cost

[data]
# Repo-relative path to the pre-downloaded corpus (resolved against the repo root).
# The corpus itself is not committed; data/manifest.json (the provenance artifact) is.
path = "data-raw/longmemeval_s_cleaned.json"
dir  = "data"

[dataset]
repo_id  = "xiaowu0162/longmemeval-cleaned"
revision = "98d7416c24c778c2fee6e6f3006e7a073259d48f"
file     = "longmemeval_s_cleaned.json"
sha256   = "d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442"

[sample]
comparison_n     = 150   # all three arms are compared on exactly these
full_n           = 500   # errata + naive additionally run the full corpus
smoke_n          = 25     # smoke eval; never published
abstention_whole = true  # all 30 abstention questions, always, in every sample
abstention_floor = 5     # smoke relaxation: at least this many abstentions when not whole

[models]
answer             = "qwen/qwen3.7-flash"          # held constant across ALL THREE arms
answer_sensitivity = "google/gemini-3.7-flash"     # footnote check only
judge_primary      = "anthropic/claude-sonnet-5"
judge_escalation   = "anthropic/claude-opus-5"     # used iff primary fails the FAR gate
judge_fallback     = "openai/gpt-5.6-terra"        # outage only, disclosed if used
perturber          = "google/gemini-3.7-flash"     # builds the judge control set
embedder           = "BAAI/bge-small-en-v1.5"      # LOCAL, naive arm + the demo beat

[generation]
answer_temperature = 0.0
answer_max_tokens  = 300
judge_temperature  = 0.0
judge_max_tokens   = 64

[naive_topk]
k                        = 10
chunk_max_chars          = 2000    # ~500 tokens
chunk_overlap_chars      = 256
respect_session_boundary = true
prepend_session_date     = true

[errata]
base_url       = "http://127.0.0.1:8787"   # deployed URL for the real runs
ask_path       = "/api/ask"
meta_path      = "/api/meta"
timeout_s      = 120
require_parity = true    # abort if /api/meta disagrees with [models].answer or prompt sha
send_question_date = true

[spend]
hard_cap_usd   = 30.00   # harness aborts mid-run at this number (raised 2026-08-18 from 15.00, approved budget extension, to fund the errata arm's full-500 run — the 350 histories not in the comparison sample must be ingested and their answers judged; ledger stood at $12.55. Previously raised 2026-08-17 from 13.00 for the 120-item judge-validation pass)
warn_at_usd    = 10.00
per_arm_cap_usd = { full_context = 8.00, judge = 9.00 }
ledger_path    = "out/ledger.jsonl"
ts_ledger_path = "../.data/ledger.jsonl"   # Errata's ingest ledger, read-only

[judge_validation]
n               = 60          # questions drawn for the control set
validation_seed = 20260818
spot_check_n    = 20          # human-labelled items
far_gate        = 0.10        # false-accept rate ceiling to pin a judge
far_gate_superseded = 0.08    # tighter ceiling for the superseded-value family
frr_gate        = 0.15        # false-reject rate ceiling
