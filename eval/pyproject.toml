requires-python = ">=3.13,<3.14"
dependencies = [
    "neo4j==6.2.0",
    "sentence-transformers==5.7.0",
    "pytest",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
